<!DOCTYPE html> <html lang="zh-CN"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">     <title>施工罚款通知单</title>     <style>         :root {             --primary: #f59e0b;             --primary-dark: #d97706;             --danger: #ef4444;             --danger-dark: #dc2626;             --safety-blue: #3b82f6;             --safety-dark: #2563eb;             --bg: #0f172a;             --bg-card: #1e293b;             --bg-input: #0f172a;             --border: #334155;             --text: #f1f5f9;             --text-dim: #94a3b8;             --success: #22c55e;         }          * {             margin: 0;             padding: 0;             box-sizing: border-box;         }          body {             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;             background: var(--bg);             color: var(--text);             min-height: 100vh;             padding-bottom: env(safe-area-inset-bottom);         }          /* ── Header ── */         .header {             background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);             border-bottom: 1px solid var(--border);             padding: 16px 20px;             position: sticky;             top: 0;             z-index: 100;             backdrop-filter: blur(20px);             display: flex;             align-items: center;             justify-content: space-between;         }          .header-content {             flex: 1;             display: flex;             flex-direction: column;             align-items: center;         }          .history-link {             position: absolute;             right: 20px;             font-size: 24px;             text-decoration: none;             color: var(--text-dim);             transition: all 0.2s;         }                  .history-link:hover {             color: var(--primary);             transform: scale(1.1);         }          .header h1 {             font-size: 20px;             font-weight: 700;             text-align: center;             background: linear-gradient(135deg, var(--primary) 0%, #fbbf24 100%);             -webkit-background-clip: text;             -webkit-text-fill-color: transparent;             letter-spacing: 2px;         }          .header .ticket-number {             text-align: center;             font-size: 13px;             color: var(--text-dim);             margin-top: 4px;             font-family: 'Courier New', monospace;         }          /* ── Type Switcher ── */         .type-switcher {             display: flex;             gap: 0;             margin: 16px 20px 0;             border-radius: 12px;             overflow: hidden;             border: 1px solid var(--border);         }          .type-btn {             flex: 1;             padding: 14px;             border: none;             font-size: 15px;             font-weight: 600;             cursor: pointer;             transition: all 0.3s ease;             background: var(--bg-card);             color: var(--text-dim);             position: relative;             overflow: hidden;         }          .type-btn::before {             content: '';             position: absolute;             top: 0;             left: 0;             right: 0;             height: 3px;             background: transparent;             transition: background 0.3s;         }          .type-btn.active-quality {             background: linear-gradient(180deg, rgba(245,158,11,0.15) 0%, transparent 100%);             color: var(--primary);         }          .type-btn.active-quality::before {             background: linear-gradient(90deg, var(--primary), #fbbf24);         }          .type-btn.active-safety {             background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, transparent 100%);             color: var(--safety-blue);         }          .type-btn.active-safety::before {             background: linear-gradient(90deg, var(--safety-blue), #60a5fa);         }          /* ── Form Section ── */         .container {             padding: 0 20px 100px;         }          .section {             margin-top: 20px;         }          .section-title {             font-size: 14px;             font-weight: 600;             color: var(--text-dim);             margin-bottom: 10px;             display: flex;             align-items: center;             gap: 6px;         }          .section-title .dot {             width: 6px;             height: 6px;             border-radius: 50%;             background: var(--primary);         }          .form-group {             margin-bottom: 14px;         }          .form-group label {             display: block;             font-size: 13px;             color: var(--text-dim);             margin-bottom: 6px;             font-weight: 500;         }          .form-input {             width: 100%;             padding: 12px 14px;             background: var(--bg-input);             border: 1px solid var(--border);             border-radius: 10px;             color: var(--text);             font-size: 15px;             outline: none;             transition: border-color 0.2s, box-shadow 0.2s;             -webkit-appearance: none;         }          .form-input:focus {             border-color: var(--primary);             box-shadow: 0 0 0 3px rgba(245,158,11,0.1);         }          .form-input::placeholder {             color: #475569;         }          .form-row {             display: grid;             grid-template-columns: 1fr 1fr;             gap: 12px;         }          /* ── Description Section ── */         .desc-input {             width: 100%;             min-height: 100px;             padding: 12px 14px;             background: var(--bg-input);             border: 1px solid var(--border);             border-radius: 10px;             color: var(--text);             font-size: 15px;             outline: none;             resize: vertical;             font-family: inherit;             transition: border-color 0.2s;         }          .desc-input:focus {             border-color: var(--primary);             box-shadow: 0 0 0 3px rgba(245,158,11,0.1);         }          .ai-btn {             display: flex;             align-items: center;             justify-content: center;             gap: 8px;             width: 100%;             padding: 12px;             margin-top: 10px;             border: 1px dashed var(--primary);             border-radius: 10px;             background: rgba(245,158,11,0.05);             color: var(--primary);             font-size: 14px;             font-weight: 600;             cursor: pointer;             transition: all 0.2s;         }          .ai-btn:hover {             background: rgba(245,158,11,0.1);         }          .ai-btn:disabled {             opacity: 0.5;             cursor: not-allowed;         }          .ai-btn .spinner {             width: 16px;             height: 16px;             border: 2px solid transparent;             border-top-color: var(--primary);             border-radius: 50%;             animation: spin 0.8s linear infinite;         }          @keyframes spin {             to { transform: rotate(360deg); }         }          .desc-result {             width: 100%;             min-height: 150px;             padding: 14px;             background: var(--bg-input);             border: 1px solid var(--border);             border-radius: 10px;             color: var(--text);             font-size: 14px;             line-height: 1.7;             outline: none;             resize: vertical;             font-family: inherit;             margin-top: 10px;             display: none;         }          .desc-result.show {             display: block;         }          /* ── Photo Section ── */         .photo-grid {             display: grid;             grid-template-columns: repeat(3, 1fr);             gap: 10px;             margin-top: 10px;         }          .photo-add {             aspect-ratio: 1;             border: 2px dashed var(--border);             border-radius: 12px;             display: flex;             flex-direction: column;             align-items: center;             justify-content: center;             gap: 6px;             cursor: pointer;             transition: all 0.2s;             background: rgba(255,255,255,0.02);         }          .photo-add:hover {             border-color: var(--primary);             background: rgba(245,158,11,0.05);         }          .photo-add .icon {             font-size: 28px;             color: var(--text-dim);         }          .photo-add .label {             font-size: 12px;             color: var(--text-dim);         }          .photo-item {             aspect-ratio: 1;             border-radius: 12px;             overflow: hidden;             position: relative;         }          .photo-item img {             width: 100%;             height: 100%;             object-fit: cover;         }          .photo-item .remove-btn {             position: absolute;             top: 6px;             right: 6px;             width: 24px;             height: 24px;             border-radius: 50%;             background: rgba(0,0,0,0.7);             color: white;             border: none;             font-size: 14px;             cursor: pointer;             display: flex;             align-items: center;             justify-content: center;             backdrop-filter: blur(4px);         }          /* ── Bottom Action ── */         .bottom-bar {             position: fixed;             bottom: 0;             left: 0;             right: 0;             padding: 16px 20px;             padding-bottom: calc(16px + env(safe-area-inset-bottom));             background: linear-gradient(180deg, transparent 0%, var(--bg) 20%);             z-index: 100;         }          .generate-btn {             width: 100%;             padding: 16px;             border: none;             border-radius: 14px;             font-size: 16px;             font-weight: 700;             cursor: pointer;             transition: all 0.3s;             color: white;             background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);             box-shadow: 0 4px 20px rgba(245,158,11,0.3);             letter-spacing: 2px;             position: relative;             overflow: hidden;         }          .generate-btn::after {             content: '';             position: absolute;             top: 0;             left: -100%;             width: 100%;             height: 100%;             background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);             transition: left 0.5s;         }          .generate-btn:hover::after {             left: 100%;         }          .generate-btn:active {             transform: scale(0.98);         }          .generate-btn:disabled {             opacity: 0.6;             cursor: not-allowed;         }          .generate-btn.safety-mode {             background: linear-gradient(135deg, var(--safety-blue) 0%, var(--safety-dark) 100%);             box-shadow: 0 4px 20px rgba(59,130,246,0.3);         }          /* ── Toast ── */         .toast {             position: fixed;             top: 80px;             left: 50%;             transform: translateX(-50%) translateY(-20px);             padding: 12px 24px;             border-radius: 12px;             font-size: 14px;             font-weight: 500;             z-index: 1000;             opacity: 0;             transition: all 0.3s;             pointer-events: none;             white-space: nowrap;         }          .toast.show {             opacity: 1;             transform: translateX(-50%) translateY(0);         }          .toast.success {             background: rgba(34,197,94,0.9);             color: white;             backdrop-filter: blur(10px);         }          .toast.error {             background: rgba(239,68,68,0.9);             color: white;             backdrop-filter: blur(10px);         }          /* ── Download Modal ── */         .modal-overlay {             position: fixed;             inset: 0;             background: rgba(0,0,0,0.6);             backdrop-filter: blur(8px);             z-index: 200;             display: none;             align-items: center;             justify-content: center;             padding: 20px;         }          .modal-overlay.show {             display: flex;         }          .modal {             background: var(--bg-card);             border: 1px solid var(--border);             border-radius: 20px;             padding: 32px 24px;             width: 100%;             max-width: 360px;             text-align: center;             animation: modalIn 0.3s ease;         }          @keyframes modalIn {             from { transform: scale(0.9); opacity: 0; }             to { transform: scale(1); opacity: 1; }         }          .modal .check-icon {             width: 60px;             height: 60px;             border-radius: 50%;             background: rgba(34,197,94,0.15);             display: flex;             align-items: center;             justify-content: center;             margin: 0 auto 16px;             font-size: 30px;         }          .modal h3 {             font-size: 18px;             margin-bottom: 8px;         }          .modal .ticket-num {             color: var(--text-dim);             font-size: 14px;             margin-bottom: 24px;             font-family: 'Courier New', monospace;         }          .modal-actions {             display: flex;             flex-direction: column;             gap: 10px;         }          .modal-btn {             padding: 14px;             border-radius: 12px;             border: none;             font-size: 15px;             font-weight: 600;             cursor: pointer;             transition: all 0.2s;         }          .modal-btn.primary {             background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);             color: white;         }          .modal-btn.secondary {             background: var(--bg-input);             color: var(--text);             border: 1px solid var(--border);         }          /* ── 金额快捷选择 ── */         .amount-shortcuts {             display: flex;             gap: 8px;             margin-top: 8px;             flex-wrap: wrap;         }          .amount-chip {             padding: 6px 14px;             border-radius: 20px;             border: 1px solid var(--border);             background: var(--bg-card);             color: var(--text-dim);             font-size: 13px;             cursor: pointer;             transition: all 0.2s;         }          .amount-chip:hover,         .amount-chip.active {             border-color: var(--primary);             color: var(--primary);             background: rgba(245,158,11,0.1);         }          /* ── 适配安全模式颜色 ── */         body.safety-mode .form-input:focus {             border-color: var(--safety-blue);             box-shadow: 0 0 0 3px rgba(59,130,246,0.1);         }          body.safety-mode .desc-input:focus {             border-color: var(--safety-blue);             box-shadow: 0 0 0 3px rgba(59,130,246,0.1);         }          body.safety-mode .ai-btn {             border-color: var(--safety-blue);             color: var(--safety-blue);             background: rgba(59,130,246,0.05);         }          body.safety-mode .photo-add:hover {             border-color: var(--safety-blue);         }          body.safety-mode .section-title .dot {             background: var(--safety-blue);         }          body.safety-mode .amount-chip:hover,         body.safety-mode .amount-chip.active {             border-color: var(--safety-blue);             color: var(--safety-blue);             background: rgba(59,130,246,0.1);         }          body.safety-mode .header h1 {             background: linear-gradient(135deg, var(--safety-blue) 0%, #60a5fa 100%);             -webkit-background-clip: text;             -webkit-text-fill-color: transparent;         }     </style> </head> <body>     <!-- Toast -->     <div class="toast" id="toast"></div>      <!-- Header -->     <div class="header">         <div style="width:24px"></div> <!-- 占位符 -->         <div class="header-content">             <h1 id="headerTitle">⚠️ 工程质量罚款通知单</h1>             <div class="ticket-number" id="ticketNumber">编号加载中...</div>         </div>         <a href="/history" class="history-link" title="历史记录">📋</a>     </div>      <!-- Type Switcher -->     <div class="type-switcher">         <button class="type-btn active-quality" id="btnQuality" onclick="switchType('quality')">             🔍 质量罚款         </button>         <button class="type-btn" id="btnSafety" onclick="switchType('safety')">             🛡️ 安全罚款         </button>     </div>      <div class="container">         <!-- 基本信息 -->         <div class="section">             <div class="section-title"><span class="dot"></span> 基本信息</div>             <div class="form-group">                 <label>项目名称</label>                 <input type="text" class="form-input" id="projectName" placeholder="输入项目名称">             </div>             <div class="form-row">                 <div class="form-group">                     <label>受罚班组</label>                     <input type="text" class="form-input" id="teamName" placeholder="如：钢筋班组">                 </div>                 <div class="form-group">                     <label>违规部位</label>                     <input type="text" class="form-input" id="location" placeholder="如：3层楼板">                 </div>             </div>             <div class="form-row">                 <div class="form-group">                     <label>发现时间</label>                     <input type="date" class="form-input" id="discoveryTime">                 </div>                 <div class="form-group">                     <label>罚款金额（元）</label>                     <input type="number" class="form-input" id="amount" placeholder="0.00" min="0" step="50">                 </div>             </div>             <div class="amount-shortcuts">                 <span class="amount-chip" onclick="setAmount(200)">¥200</span>                 <span class="amount-chip" onclick="setAmount(300)">¥300</span>                 <span class="amount-chip" onclick="setAmount(500)">¥500</span>                 <span class="amount-chip" onclick="setAmount(1000)">¥1000</span>                 <span class="amount-chip" onclick="setAmount(2000)">¥2000</span>                 <span class="amount-chip" onclick="setAmount(5000)">¥5000</span>             </div>         </div>          <!-- 违规描述 -->         <div class="section">             <div class="section-title"><span class="dot"></span> 违规情况描述</div>             <textarea class="desc-input" id="descInput" placeholder="简要描述违规情况，例如：钢筋间距不符合规范，混凝土养护不到位..."></textarea>             <button class="ai-btn" id="aiBtn" onclick="generateDesc()">                 <span>✨ AI 智能生成正式描述</span>             </button>             <textarea class="desc-result" id="descResult" placeholder="AI 生成的描述将显示在这里，你可以手动编辑修改"></textarea>         </div>          <!-- 现场照片 -->         <div class="section">             <div class="section-title"><span class="dot"></span> 现场照片</div>             <div class="photo-grid" id="photoGrid">                 <div class="photo-add" onclick="addPhoto()">                     <span class="icon">📷</span>                     <span class="label">添加照片</span>                 </div>             </div>             <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)">         </div>     </div>      <!-- Bottom Bar -->     <div class="bottom-bar">         <button class="generate-btn" id="generateBtn" onclick="generateDocx()">             📄 生成罚款通知单         </button>     </div>      <!-- Download Modal -->     <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">         <div class="modal">             <div class="check-icon">✅</div>             <h3>罚款单已生成</h3>             <div class="ticket-num" id="modalTicketNum"></div>             <div class="modal-actions">                 <button class="modal-btn primary" id="shareBtn" onclick="shareFile()">📤 分享 / 保存文件</button>                 <a class="modal-btn secondary" id="downloadBtn" href="#" target="_blank" style="text-decoration:none;text-align:center;display:block;">📥 直接下载</a>                 <button class="modal-btn secondary" onclick="resetForm()">📝 开具下一张</button>             </div>         </div>     </div>      <script>         // ── 状态 ──         let currentType = 'quality';         let photos = []; // {file, dataUrl}         let lastDownloadUrl = '';          // ── 初始化 ──         document.addEventListener('DOMContentLoaded', () => {             // 设置今日日期             const today = new Date();             const dateStr = today.toISOString().split('T')[0];             document.getElementById('discoveryTime').value = dateStr;              // 从 localStorage 恢复项目名             const savedProject = localStorage.getItem('fk_project_name');             if (savedProject) {                 document.getElementById('projectName').value = savedProject;             }              refreshNumber();         });          // ── 类型切换 ──         function switchType(type) {             currentType = type;             const btnQ = document.getElementById('btnQuality');             const btnS = document.getElementById('btnSafety');             const header = document.getElementById('headerTitle');             const body = document.body;             const genBtn = document.getElementById('generateBtn');              btnQ.className = 'type-btn' + (type === 'quality' ? ' active-quality' : '');             btnS.className = 'type-btn' + (type === 'safety' ? ' active-safety' : '');              if (type === 'quality') {                 header.textContent = '⚠️ 工程质量罚款通知单';                 body.classList.remove('safety-mode');                 genBtn.classList.remove('safety-mode');             } else {                 header.textContent = '🛡️ 工程安全罚款通知单';                 body.classList.add('safety-mode');                 genBtn.classList.add('safety-mode');             }              refreshNumber();         }          // ── 编号刷新 ──         async function refreshNumber() {             try {                 const resp = await fetch(`/api/next-number?type=${currentType}`);                 const data = await resp.json();                 document.getElementById('ticketNumber').textContent = `编号：${data.number}`;             } catch (e) {                 document.getElementById('ticketNumber').textContent = '编号：--';             }         }          // ── 金额快捷 ──         function setAmount(val) {             document.getElementById('amount').value = val;             document.querySelectorAll('.amount-chip').forEach(c => {                 c.classList.toggle('active', parseInt(c.textContent.replace('¥','')) === val);             });         }          // ── AI 生成描述 ──         async function generateDesc() {             const input = document.getElementById('descInput').value.trim();             if (!input) {                 showToast('请先输入违规概况', 'error');                 return;             }              const btn = document.getElementById('aiBtn');             btn.disabled = true;             btn.innerHTML = '<span class="spinner"></span><span>正在生成中...</span>';              try {                 const resp = await fetch('/api/generate-description', {                     method: 'POST',                     headers: { 'Content-Type': 'application/json' },                     body: JSON.stringify({                         input: input,                         project_name: document.getElementById('projectName').value,                         team_name: document.getElementById('teamName').value,                         location: document.getElementById('location').value,                         penalty_type: currentType                     })                 });                 const data = await resp.json();                  if (data.error) {                     showToast('AI生成失败：' + data.error, 'error');                     return;                 }                  const resultEl = document.getElementById('descResult');                 resultEl.value = data.description;                 resultEl.classList.add('show');                 showToast('描述已生成，可手动编辑', 'success');             } catch (e) {                 showToast('生成失败：' + e.message, 'error');             } finally {                 btn.disabled = false;                 btn.innerHTML = '<span>✨ AI 智能生成正式描述</span>';             }         }          // ── 照片处理 ──         function addPhoto() {             document.getElementById('photoInput').click();         }          function handlePhotos(event) {             const files = event.target.files;             for (let f of files) {                 if (photos.length >= 9) {                     showToast('最多添加9张照片', 'error');                     break;                 }                 const reader = new FileReader();                 reader.onload = (e) => {                     photos.push({ file: f, dataUrl: e.target.result });                     renderPhotos();                 };                 reader.readAsDataURL(f);             }             event.target.value = '';         }          function removePhoto(index) {             photos.splice(index, 1);             renderPhotos();         }          function renderPhotos() {             const grid = document.getElementById('photoGrid');             grid.innerHTML = '';              photos.forEach((p, i) => {                 const item = document.createElement('div');                 item.className = 'photo-item';                 item.innerHTML = `                     <img src="${p.dataUrl}" alt="照片${i+1}">                     <button class="remove-btn" onclick="removePhoto(${i})">✕</button>                 `;                 grid.appendChild(item);             });              if (photos.length < 9) {                 const addBtn = document.createElement('div');                 addBtn.className = 'photo-add';                 addBtn.onclick = addPhoto;                 addBtn.innerHTML = '<span class="icon">📷</span><span class="label">添加照片</span>';                 grid.appendChild(addBtn);             }         }          // ── 生成 Word ──         async function generateDocx() {             // 校验             const projectName = document.getElementById('projectName').value.trim();             const teamName = document.getElementById('teamName').value.trim();             const location = document.getElementById('location').value.trim();             const amount = document.getElementById('amount').value;             const descResult = document.getElementById('descResult');             const descInput = document.getElementById('descInput');             const description = descResult.classList.contains('show')                 ? descResult.value.trim()                 : descInput.value.trim();              if (!projectName) { showToast('请输入项目名称', 'error'); return; }             if (!teamName) { showToast('请输入受罚班组', 'error'); return; }             if (!location) { showToast('请输入违规部位', 'error'); return; }             if (!amount || parseFloat(amount) <= 0) { showToast('请输入罚款金额', 'error'); return; }             if (!description) { showToast('请输入违规描述', 'error'); return; }              // 保存项目名到 localStorage             localStorage.setItem('fk_project_name', projectName);              const discoveryTime = document.getElementById('discoveryTime').value;             // 格式化日期             let dtFormatted = '';             if (discoveryTime) {                 const parts = discoveryTime.split('-');                 dtFormatted = `${parts[0]}年${parts[1]}月${parts[2]}日`;             }              const btn = document.getElementById('generateBtn');             btn.disabled = true;             btn.textContent = '⏳ 生成中...';              const formData = new FormData();             formData.append('penalty_type', currentType);             formData.append('project_name', projectName);             formData.append('team_name', teamName);             formData.append('location', location);             formData.append('discovery_time', dtFormatted);             formData.append('amount', amount);             formData.append('description', description);              for (const p of photos) {                 formData.append('photos', p.file);             }              try {                 const resp = await fetch('/api/generate-docx', { method: 'POST', body: formData });                 const data = await resp.json();                  if (data.success) {                     lastDownloadUrl = data.download_url;                     document.getElementById('modalTicketNum').textContent = `编号：${data.number}`;                     document.getElementById('downloadBtn').href = data.download_url;                     document.getElementById('modalOverlay').classList.add('show');                 } else {                     showToast('生成失败：' + data.error, 'error');                 }             } catch (e) {                 showToast('生成失败：' + e.message, 'error');             } finally {                 btn.disabled = false;                 btn.textContent = '📄 生成罚款通知单';             }         }          // ── Modal ──         function closeModal(event) {             if (event.target === document.getElementById('modalOverlay')) {                 document.getElementById('modalOverlay').classList.remove('show');             }         }          async function shareFile() {             if (!lastDownloadUrl) return;             const btn = document.getElementById('shareBtn');             btn.disabled = true;             btn.textContent = '⏳ 准备中...';             try {                 const resp = await fetch(lastDownloadUrl);                 const blob = await resp.blob();                 const fileName = lastDownloadUrl.split('/').pop();                 const file = new File([blob], fileName, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });                  if (navigator.canShare && navigator.canShare({ files: [file] })) {                     await navigator.share({ files: [file], title: fileName });                 } else {                     // 不支持 Web Share，回退为下载                     const a = document.createElement('a');                     a.href = URL.createObjectURL(blob);                     a.download = fileName;                     a.click();                     URL.revokeObjectURL(a.href);                 }             } catch (e) {                 if (e.name !== 'AbortError') {                     showToast('分享失败：' + e.message, 'error');                 }             } finally {                 btn.disabled = false;                 btn.textContent = '📤 分享 / 保存文件';             }         }          function resetForm() {             document.getElementById('modalOverlay').classList.remove('show');             document.getElementById('teamName').value = '';             document.getElementById('location').value = '';             document.getElementById('amount').value = '';             document.getElementById('descInput').value = '';             document.getElementById('descResult').value = '';             document.getElementById('descResult').classList.remove('show');             photos = [];             renderPhotos();             document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('active'));              // 刷新编号             refreshNumber();              // 重设日期             const today = new Date();             document.getElementById('discoveryTime').value = today.toISOString().split('T')[0];              showToast('表单已重置', 'success');         }          // ── Toast ──         function showToast(msg, type = 'success') {             const toast = document.getElementById('toast');             toast.textContent = msg;             toast.className = `toast ${type} show`;             setTimeout(() => toast.classList.remove('show'), 2500);         }     </script> </body> </html>
