<!DOCTYPE html> <html lang="zh-CN"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">     <title>访问验证</title>     <style>         * { margin: 0; padding: 0; box-sizing: border-box; }         body {             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;             background: #0f172a;             color: #f1f5f9;             min-height: 100vh;             display: flex;             align-items: center;             justify-content: center;             padding: 20px;         }         .login-card {             background: #1e293b;             border: 1px solid #334155;             border-radius: 20px;             padding: 40px 28px;             width: 100%;             max-width: 360px;             text-align: center;         }         .login-card .icon { font-size: 48px; margin-bottom: 16px; }         .login-card h2 { font-size: 20px; margin-bottom: 8px; }         .login-card .sub { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }         .login-card input {             width: 100%;             padding: 14px 16px;             background: #0f172a;             border: 1px solid #334155;             border-radius: 12px;             color: #f1f5f9;             font-size: 16px;             outline: none;             text-align: center;             letter-spacing: 4px;             margin-bottom: 16px;             -webkit-appearance: none;         }         .login-card input:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }         .login-card button {             width: 100%;             padding: 14px;             border: none;             border-radius: 12px;             background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);             color: white;             font-size: 16px;             font-weight: 600;             cursor: pointer;             transition: transform 0.2s;         }         .login-card button:active { transform: scale(0.97); }         .error { color: #ef4444; font-size: 14px; margin-bottom: 12px; }     </style> </head> <body>     <form class="login-card" method="POST" action="/login">         <div class="icon">🔒</div>         <h2>施工罚款系统</h2>         <div class="sub">请输入访问密码</div>         {% if error %}<div class="error">{{ error }}</div>{% endif %}         <input type="password" name="password" placeholder="输入密码" autofocus required>         <button type="submit">进 入</button>     </form> </body> </html>
