<!DOCTYPE html> <html lang="zh-CN"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">     <title>历史罚单</title>     <style>         * { margin: 0; padding: 0; box-sizing: border-box; }         body {             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;             background: #0f172a;             color: #f1f5f9;             min-height: 100vh;         }         .header {             background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);             border-bottom: 1px solid #334155;             padding: 16px 20px;             position: sticky;             top: 0;             z-index: 100;             display: flex;             align-items: center;             justify-content: space-between;         }         .header h1 {             font-size: 18px;             font-weight: 700;             background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);             -webkit-background-clip: text;             -webkit-text-fill-color: transparent;         }         .back-btn {             color: #94a3b8;             text-decoration: none;             font-size: 14px;             padding: 8px 14px;             border-radius: 8px;             border: 1px solid #334155;             transition: all 0.2s;         }         .back-btn:hover { border-color: #f59e0b; color: #f59e0b; }         .count-badge {             font-size: 13px;             color: #94a3b8;             background: #1e293b;             padding: 4px 10px;             border-radius: 12px;             border: 1px solid #334155;         }         .container { padding: 12px 16px 40px; }         .empty {             text-align: center;             padding: 80px 20px;             color: #475569;         }         .empty .icon { font-size: 48px; margin-bottom: 12px; }         .empty p { font-size: 15px; }          .ticket-card {             background: #1e293b;             border: 1px solid #334155;             border-radius: 14px;             padding: 16px;             margin-bottom: 12px;             transition: all 0.2s;         }         .ticket-card:active { transform: scale(0.98); }         .ticket-top {             display: flex;             justify-content: space-between;             align-items: center;             margin-bottom: 10px;         }         .ticket-number {             font-family: 'Courier New', monospace;             font-size: 14px;             font-weight: 600;             color: #f59e0b;         }         .ticket-number.safety { color: #3b82f6; }         .ticket-type {             font-size: 12px;             padding: 3px 8px;             border-radius: 6px;             font-weight: 600;         }         .ticket-type.quality {             background: rgba(245,158,11,0.15);             color: #f59e0b;         }         .ticket-type.safety {             background: rgba(59,130,246,0.15);             color: #3b82f6;         }         .ticket-info {             display: grid;             grid-template-columns: 1fr 1fr;             gap: 6px 12px;             font-size: 13px;             color: #94a3b8;         }         .ticket-info .label { color: #64748b; }         .ticket-info .value { color: #e2e8f0; }         .ticket-amount {             margin-top: 10px;             padding-top: 10px;             border-top: 1px solid #334155;             display: flex;             justify-content: space-between;             align-items: center;         }         .ticket-amount .price {             font-size: 18px;             font-weight: 700;             color: #ef4444;         }         .ticket-amount .time {             font-size: 12px;             color: #64748b;         }         .ticket-actions {             display: flex;             gap: 8px;             margin-top: 10px;         }         .ticket-actions a {             flex: 1;             padding: 8px;             border-radius: 8px;             border: 1px solid #334155;             background: transparent;             color: #94a3b8;             font-size: 13px;             text-align: center;             text-decoration: none;             transition: all 0.2s;             cursor: pointer;         }         .ticket-actions a:hover {             border-color: #f59e0b;             color: #f59e0b;         }         .ticket-desc {             font-size: 12px;             color: #64748b;             margin-top: 8px;             line-height: 1.5;             display: none;         }         .ticket-desc.show { display: block; }     </style> </head> <body>     <div class="header">         <a href="/" class="back-btn">← 返回开单</a>         <h1>📋 历史罚单</h1>         <span class="count-badge" id="countBadge">0 张</span>     </div>     <div class="container" id="list"></div>      <script>         document.addEventListener('DOMContentLoaded', loadHistory);          async function loadHistory() {             const list = document.getElementById('list');             try {                 const resp = await fetch('/api/history');                 const data = await resp.json();                 document.getElementById('countBadge').textContent = `${data.length} 张`;                  if (data.length === 0) {                     list.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无历史罚单</p></div>';                     return;                 }                  list.innerHTML = data.map((item, idx) => {                     const isQuality = item.penalty_type === 'quality';                     const typeName = isQuality ? '质量' : '安全';                     const typeClass = isQuality ? 'quality' : 'safety';                     return `                         <div class="ticket-card" onclick="toggleDesc(${idx})">                             <div class="ticket-top">                                 <span class="ticket-number ${typeClass}">${item.number}</span>                                 <span class="ticket-type ${typeClass}">${typeName}罚款</span>                             </div>                             <div class="ticket-info">                                 <span class="label">项目</span><span class="value">${item.project_name}</span>                                 <span class="label">班组</span><span class="value">${item.team_name}</span>                                 <span class="label">部位</span><span class="value">${item.location}</span>                                 <span class="label">时间</span><span class="value">${item.discovery_time}</span>                             </div>                             <div class="ticket-desc" id="desc-${idx}">${item.description || ''}</div>                             <div class="ticket-amount">                                 <span class="price">¥${parseFloat(item.amount).toLocaleString()}</span>                                 <span class="time">${item.created_at}</span>                             </div>                             <div class="ticket-actions">                                 <a href="/download/${item.filename}" target="_blank">📥 下载</a>                                 <a onclick="event.stopPropagation();shareItem('${item.filename}')">📤 分享</a>                             </div>                         </div>                     `;                 }).join('');             } catch (e) {                 list.innerHTML = '<div class="empty"><div class="icon">❌</div><p>加载失败</p></div>';             }         }          function toggleDesc(idx) {             document.getElementById(`desc-${idx}`).classList.toggle('show');         }          async function shareItem(filename) {             try {                 const resp = await fetch(`/download/${filename}`);                 const blob = await resp.blob();                 const file = new File([blob], filename, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });                 if (navigator.canShare && navigator.canShare({ files: [file] })) {                     await navigator.share({ files: [file], title: filename });                 } else {                     window.open(`/download/${filename}`, '_blank');                 }             } catch (e) {                 if (e.name !== 'AbortError') alert('分享失败: ' + e.message);             }         }     </script> </body> </html>
