services:
  app:
    build: .
    container_name: safeinspect
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before deployment}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/safeinspect.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env before deployment}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before deployment}
      - ADMIN_REAL_NAME=${ADMIN_REAL_NAME:-管理员}
