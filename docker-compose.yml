services:
  app:
    build: .
    container_name: safeinspect
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-safeinspect-prod-secret-key-2024}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/safeinspect.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-spencer}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-s2484815}
      - ADMIN_REAL_NAME=${ADMIN_REAL_NAME:-Spencer}
