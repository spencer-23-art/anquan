services:
  app:
    build: .
    container_name: safeinspect
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-safeinspect-prod-secret-key-2024}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/safeinspect.db}
